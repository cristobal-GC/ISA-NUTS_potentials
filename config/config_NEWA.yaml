########## PARAMETERS

cutout_params:
  era5_2013:
    path: "~/SANDBOX/cutouts/europe-2021-sarah3-era5.nc"
  newa_2013:
    path: "~/DOCK_01/local/Ryz3975/cutouts/IP-2013-solarwind_newa_0_05_cp.nc"

CF_params:
  onwind:
    turbine: Vestas_V112_3MW_h100
    correction_factor: 0.93
    cap_per_sqkm: 10
    CF_threshold: 0.3
  solar:
    panel: CSi
    orientation:
      slope: 35
      azimuth: 180.0
    correction_factor: 0.85
    cap_per_sqkm: 50

fig_params:
  sizes:
    LR:
      size: 12
      linewidth: 1.5
      fontsize: 16
    HR:
      size: 36
      linewidth: 4.5
      fontsize: 48
  cutout:
    onwind:
      cmap: viridis
      units: m/s
    solar:
      cmap: YlOrRd
      units: W/m2
  CF:
    onwind:
      cmap: BuPu
    solar:
      cmap: BuPu
  CAPACITY:
    onwind:
      cmap: YlGn
      units: MW
    solar:
      cmap: YlGn
      units: MW
  ISA:
    colors:
      0: "#d73027"
      1: "#fc8d59"
      2: "#fee08b"
      3: "#91bfdb"
      4: "#1a9850"
    labels:
      0: "Maximum"
      1: "Very high"
      2: "High"
      3: "Moderate"
      4: "Low"



